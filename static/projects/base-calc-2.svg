<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#091a24"/>
      <stop offset="100%" stop-color="#021f1a"/>
    </linearGradient>
    <filter id="bcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bcBg)"/>

  <!-- Matrix / Binary Stream Background -->
  <g fill="#10b981" opacity="0.12" font-family="monospace" font-size="12">
    <text x="30" y="50">10110010 01101001 11001100 00110101 10101010 11110000</text>
    <text x="30" y="100">01010101 11001010 00110011 11111111 00000000 10101010</text>
    <text x="30" y="400">11001100 01010101 11100010 00101010 11010101 01010101</text>
    <text x="30" y="430">00101010 11110000 10101010 01010101 11001100 00110101</text>
  </g>

  <!-- Ambient Glow -->
  <circle cx="200" cy="220" r="140" fill="#10b981" fill-opacity="0.1" filter="url(#bcGlow)"/>
  <circle cx="600" cy="220" r="140" fill="#06b6d4" fill-opacity="0.1" filter="url(#bcGlow)"/>

  <!-- Window Frame -->
  <rect x="70" y="60" width="660" height="330" rx="16" fill="#041217" fill-opacity="0.92" stroke="#10b981" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="70" y="60" width="660" height="42" rx="16" fill="#082026"/>
  <circle cx="100" cy="81" r="5" fill="#ef4444"/>
  <circle cx="118" cy="81" r="5" fill="#eab308"/>
  <circle cx="136" cy="81" r="5" fill="#22c55e"/>
  <text x="400" y="86" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Base Calculator &amp; Number Systems Converter (C# / WPF)</text>

  <!-- Input Formula Display -->
  <rect x="100" y="120" width="600" height="48" rx="8" fill="#02080a" stroke="#10b981" stroke-width="1"/>
  <text x="120" y="150" fill="#a7f3d0" font-family="monospace" font-size="15">INPUT: <tspan fill="#38bdf8">110101 (BIN)</tspan> + <tspan fill="#fbbf24">3F (HEX)</tspan> = <tspan fill="#4ade80">116 (DEC)</tspan></text>

  <!-- 4 Base Conversion Cards Grid -->
  <g transform="translate(100, 185)">
    <!-- Binary -->
    <rect x="0" y="0" width="135" height="90" rx="8" fill="#092224" stroke="#38bdf8" stroke-width="1"/>
    <text x="67" y="24" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">BINARY (BASE 2)</text>
    <text x="67" y="55" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">01110100</text>
    <text x="67" y="75" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">8-bit / Radix 2</text>

    <!-- Octal -->
    <rect x="155" y="0" width="135" height="90" rx="8" fill="#092224" stroke="#a78bfa" stroke-width="1"/>
    <text x="222" y="24" fill="#a78bfa" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">OCTAL (BASE 8)</text>
    <text x="222" y="55" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="15" text-anchor="middle">164</text>
    <text x="222" y="75" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Radix 8</text>

    <!-- Decimal -->
    <rect x="310" y="0" width="135" height="90" rx="8" fill="#092224" stroke="#34d399" stroke-width="1.5"/>
    <text x="377" y="24" fill="#34d399" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">DECIMAL (BASE 10)</text>
    <text x="377" y="55" fill="#34d399" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">116</text>
    <text x="377" y="75" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Radix 10 (Main)</text>

    <!-- Hexadecimal -->
    <rect x="465" y="0" width="135" height="90" rx="8" fill="#092224" stroke="#fbbf24" stroke-width="1"/>
    <text x="532" y="24" fill="#fbbf24" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">HEX (BASE 16)</text>
    <text x="532" y="55" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="15" text-anchor="middle">0x74</text>
    <text x="532" y="75" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Radix 16</text>
  </g>

  <!-- Step Breakdown Ribbon -->
  <rect x="100" y="295" width="600" height="70" rx="8" fill="#082026" stroke="#1e293b" stroke-width="1"/>
  <text x="120" y="322" fill="#6ee7b7" font-family="sans-serif" font-weight="bold" font-size="12">STEP-BY-STEP MATHEMATICAL PROOF:</text>
  <text x="120" y="345" fill="#94a3b8" font-family="monospace" font-size="11">110101₂ = (1×32)+(1×16)+(0×8)+(1×4)+(0×2)+(1×1) = 53₁₀ | 3F₁₆ = (3×16)+(15×1) = 63₁₀</text>
</svg>
