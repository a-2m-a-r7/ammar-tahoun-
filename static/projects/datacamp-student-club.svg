<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#033043"/>
    </linearGradient>
    <linearGradient id="dcCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#05dfd7"/>
    </linearGradient>
    <linearGradient id="dcCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="dcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#dcBg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#00f5ff" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glow Orb -->
  <circle cx="680" cy="120" r="140" fill="#00f5ff" fill-opacity="0.12" filter="url(#dcGlow)"/>
  <circle cx="150" cy="380" r="100" fill="#05dfd7" fill-opacity="0.08" filter="url(#dcGlow)"/>

  <!-- Code Window Mockup -->
  <rect x="70" y="60" width="660" height="330" rx="16" fill="url(#dcCard)" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="70" y="60" width="660" height="44" rx="16" fill="#0f172a" fill-opacity="0.95"/>
  <circle cx="100" cy="82" r="6" fill="#ef4444"/>
  <circle cx="120" cy="82" r="6" fill="#eab308"/>
  <circle cx="140" cy="82" r="6" fill="#22c55e"/>
  <text x="400" y="87" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">datacamp-student-club.vercel.app</text>

  <!-- Left: IDE Code Preview -->
  <rect x="95" y="125" width="340" height="235" rx="10" fill="#020617" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
  <text x="115" y="155" fill="#38bdf8" font-family="monospace" font-size="13"># In-Browser Python Sandbox (Wasm)</text>
  <text x="115" y="180" fill="#c084fc" font-family="monospace" font-size="13">import <tspan fill="#f8fafc">numpy as np</tspan></text>
  <text x="115" y="205" fill="#c084fc" font-family="monospace" font-size="13">import <tspan fill="#f8fafc">gemini_nexus as ai</tspan></text>
  <text x="115" y="240" fill="#64748b" font-family="monospace" font-size="13"># Initialize Club AI Mentor</text>
  <text x="115" y="265" fill="#f8fafc" font-family="monospace" font-size="13">mentor = ai.NEXUS(bilingual=<tspan fill="#4ade80">True</tspan>)</text>
  <text x="115" y="290" fill="#f8fafc" font-family="monospace" font-size="13">response = mentor.explain(<tspan fill="#fbbf24">"Neural Nets"</tspan>)</text>
  <text x="115" y="325" fill="#4ade80" font-family="monospace" font-size="13">> Output: Ready. 0-server execution ✓</text>

  <!-- Right: Platform Badges & Metrics -->
  <rect x="460" y="125" width="245" height="105" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="480" y="155" fill="#00f5ff" font-family="sans-serif" font-weight="bold" font-size="14">NEXUS AI MENTOR</text>
  <text x="480" y="180" fill="#e2e8f0" font-family="sans-serif" font-size="12">Google Gemini 2.5 Flash</text>
  <text x="480" y="202" fill="#94a3b8" font-family="sans-serif" font-size="11">RAG Context · Bilingual (AR/EN)</text>

  <rect x="460" y="245" width="245" height="115" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
  <text x="480" y="275" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14">STACK HIGHLIGHTS</text>
  <text x="480" y="300" fill="#e2e8f0" font-family="sans-serif" font-size="12">React 19 · TypeScript · Vite</text>
  <text x="480" y="322" fill="#94a3b8" font-family="sans-serif" font-size="11">Pyodide Wasm · Firebase Firestore</text>
  <text x="480" y="342" fill="#22c55e" font-family="sans-serif" font-weight="bold" font-size="11">● Live Production Deployment</text>
</svg>
