<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="smBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#081b26"/>
      <stop offset="100%" stop-color="#042738"/>
    </linearGradient>
    <filter id="smGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#smBg)"/>

  <!-- Radial Cyber Grid -->
  <g stroke="#00f5ff" stroke-opacity="0.08" stroke-width="1">
    <circle cx="400" cy="225" r="80" fill="none"/>
    <circle cx="400" cy="225" r="160" fill="none"/>
    <circle cx="400" cy="225" r="260" fill="none"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="120" y1="0" x2="680" y2="450"/>
    <line x1="120" y1="450" x2="680" y2="0"/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="400" cy="225" r="32" fill="#020617" stroke="#00f5ff" stroke-width="2.5" filter="url(#smGlow)"/>
  <text x="400" y="230" fill="#00f5ff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">AI OS</text>

  <!-- Connected Subsystems -->
  <g stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="400" y1="193" x2="400" y2="120"/>
    <line x1="400" y1="257" x2="400" y2="330"/>
    <line x1="368" y1="225" x2="220" y2="225"/>
    <line x1="432" y1="225" x2="580" y2="225"/>
  </g>

  <!-- Node 1: Vision Analytics (Top) -->
  <rect x="290" y="70" width="220" height="50" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="93" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VISION FLOW ANALYTICS</text>
  <text x="400" y="109" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Python · OpenCV · Density Heatmap</text>

  <!-- Node 2: Predictive Inventory (Bottom) -->
  <rect x="290" y="330" width="220" height="50" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="400" y="353" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PREDICTIVE INVENTORY</text>
  <text x="400" y="369" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Demand Forecasting · Restock Alerts</text>

  <!-- Node 3: Dispatch & IoT (Left) -->
  <rect x="90" y="200" width="130" height="50" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="155" y="223" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ENERGY &amp; IOT</text>
  <text x="155" y="239" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Automated Triggers</text>

  <!-- Node 4: Control Plane (Right) -->
  <rect x="580" y="200" width="130" height="50" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <text x="645" y="223" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CONTROL PLANE</text>
  <text x="645" y="239" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">TypeScript · APIs</text>

  <!-- Bottom Brand Ribbon -->
  <rect x="150" y="405" width="500" height="28" rx="6" fill="#020617" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="400" y="423" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">SMARTMALL AI OS · INTELLIGENT COMMERCIAL OPERATING SYSTEM</text>
</svg>
