<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="dgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#19152b"/>
      <stop offset="100%" stop-color="#0e0a1f"/>
    </linearGradient>
    <filter id="dgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#dgBg)"/>

  <!-- Stars -->
  <g fill="#f8fafc" opacity="0.4">
    <circle cx="120" cy="90" r="1.5"/>
    <circle cx="260" cy="130" r="1"/>
    <circle cx="480" cy="80" r="2"/>
    <circle cx="650" cy="110" r="1.5"/>
    <circle cx="710" cy="70" r="1"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="220" r="140" fill="#f59e0b" fill-opacity="0.12" filter="url(#dgGlow)"/>

  <!-- Window Frame -->
  <rect x="70" y="60" width="660" height="330" rx="16" fill="#0f0b1e" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="70" y="60" width="660" height="42" rx="16" fill="#1b122e"/>
  <circle cx="100" cy="81" r="5" fill="#ef4444"/>
  <circle cx="118" cy="81" r="5" fill="#eab308"/>
  <circle cx="136" cy="81" r="5" fill="#22c55e"/>
  <text x="400" y="86" fill="#fcd34d" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Dino Game Pro (C# / WPF 60 FPS Desktop Engine)</text>

  <!-- Game HUD -->
  <g transform="translate(100, 120)">
    <text x="0" y="24" fill="#64748b" font-family="monospace" font-size="14">HI 09482</text>
    <text x="120" y="24" fill="#fbbf24" font-family="monospace" font-weight="bold" font-size="16">02450</text>
    <text x="500" y="24" fill="#22c55e" font-family="monospace" font-weight="bold" font-size="12">60.0 FPS ●</text>
  </g>

  <!-- Ground Line -->
  <line x1="100" y1="280" x2="700" y2="280" stroke="#f59e0b" stroke-width="2"/>
  <line x1="100" y1="284" x2="700" y2="284" stroke="#475569" stroke-width="1" stroke-dasharray="12,12"/>

  <!-- Pixel / Stylized Dino -->
  <g transform="translate(180, 200)" fill="#fbbf24">
    <!-- Dino Head & Eye -->
    <rect x="30" y="0" width="30" height="25" rx="3"/>
    <rect x="36" y="6" width="6" height="6" fill="#020617"/>
    <!-- Snout & Mouth -->
    <rect x="50" y="10" width="16" height="15" rx="2"/>
    <!-- Body -->
    <rect x="15" y="22" width="35" height="35" rx="4"/>
    <!-- Arms -->
    <rect x="42" y="32" width="12" height="6" rx="2"/>
    <!-- Legs Running -->
    <rect x="18" y="55" width="8" height="25" rx="2"/>
    <rect x="35" y="55" width="8" height="18" rx="2"/>
    <!-- Tail -->
    <rect x="0" y="28" width="18" height="12" rx="3"/>
  </g>

  <!-- Cactus Hazards -->
  <g transform="translate(480, 215)" fill="#34d399">
    <rect x="10" y="0" width="10" height="65" rx="3"/>
    <rect x="0" y="15" width="10" height="20" rx="2"/>
    <rect x="0" y="25" width="25" height="10" rx="2"/>
    <rect x="20" y="20" width="10" height="20" rx="2"/>
    <rect x="15" y="30" width="20" height="10" rx="2"/>
  </g>
  <g transform="translate(540, 230)" fill="#34d399">
    <rect x="5" y="0" width="8" height="50" rx="2"/>
    <rect x="0" y="10" width="18" height="8" rx="2"/>
  </g>

  <!-- Controls Banner -->
  <g transform="translate(100, 315)">
    <rect width="600" height="50" rx="8" fill="#1b122e" stroke="#334155" stroke-width="1"/>
    <text x="25" y="25" fill="#fcd34d" font-family="sans-serif" font-weight="bold" font-size="11">CONTROLS &amp; TECH</text>
    <text x="25" y="40" fill="#cbd5e1" font-family="sans-serif" font-size="11">Spacebar / Up Arrow to Jump · DispatcherTimer Game Loop · 0ms GC Jitter</text>
    <rect x="475" y="12" width="110" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="530" y="29" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">.NET 9 WPF</text>
  </g>
</svg>
