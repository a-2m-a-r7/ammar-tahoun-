<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#09122a"/>
      <stop offset="100%" stop-color="#140a2b"/>
    </linearGradient>
    <linearGradient id="csViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="csGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#csBg)"/>

  <!-- Circuit Schematic Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="140" fill="#8b5cf6" fill-opacity="0.12" filter="url(#csGlow)"/>
  <circle cx="620" cy="280" r="120" fill="#06b6d4" fill-opacity="0.1" filter="url(#csGlow)"/>

  <!-- Main Window -->
  <rect x="70" y="60" width="660" height="330" rx="16" fill="#090d1f" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="70" y="60" width="660" height="42" rx="16" fill="#0f172a" fill-opacity="0.9"/>
  <circle cx="100" cy="81" r="5" fill="#ef4444"/>
  <circle cx="118" cy="81" r="5" fill="#eab308"/>
  <circle cx="136" cy="81" r="5" fill="#22c55e"/>
  <text x="400" y="86" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CircuitSim Pro (.NET 9 WPF Desktop)</text>

  <!-- Left: Schematic Circuit Diagram -->
  <g transform="translate(100, 125)">
    <rect width="320" height="235" rx="10" fill="#020617" stroke="#334155" stroke-width="1"/>
    
    <!-- Power Source Battery -->
    <line x1="50" y1="70" x2="110" y2="70" stroke="#00f5ff" stroke-width="2"/>
    <line x1="110" y1="55" x2="110" y2="85" stroke="#00f5ff" stroke-width="3"/>
    <line x1="120" y1="62" x2="120" y2="78" stroke="#00f5ff" stroke-width="1.5"/>
    <line x1="120" y1="70" x2="190" y2="70" stroke="#00f5ff" stroke-width="2"/>
    <text x="115" y="45" fill="#00f5ff" font-family="monospace" font-size="11" text-anchor="middle">V = 12.0 V</text>

    <!-- Resistor Zig-Zag -->
    <path d="M 190 70 L 200 60 L 210 80 L 220 60 L 230 80 L 240 70 L 270 70" fill="none" stroke="#a855f7" stroke-width="2.5"/>
    <text x="230" y="45" fill="#c084fc" font-family="monospace" font-size="11" text-anchor="middle">R = 24.0 Ω</text>

    <!-- Circuit Down & Return Loop -->
    <line x1="270" y1="70" x2="270" y2="170" stroke="#00f5ff" stroke-width="2"/>
    <circle cx="270" cy="120" r="14" fill="#020617" stroke="#fbbf24" stroke-width="2"/>
    <text x="270" y="124" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">A</text>
    
    <line x1="270" y1="170" x2="50" y2="170" stroke="#00f5ff" stroke-width="2"/>
    <line x1="50" y1="170" x2="50" y2="70" stroke="#00f5ff" stroke-width="2"/>
    
    <!-- Dynamic Meter Badge -->
    <rect x="70" y="195" width="180" height="30" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <text x="160" y="215" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">I = V/R = 0.50 A</text>
  </g>

  <!-- Right: Oscilloscope Waveform & Tech Badges -->
  <g transform="translate(445, 125)">
    <!-- Oscilloscope Screen -->
    <rect width="260" height="110" rx="10" fill="#020617" stroke="#00f5ff" stroke-width="1"/>
    <text x="20" y="24" fill="#38bdf8" font-family="monospace" font-size="11">SIGNAL OSCILLOSCOPE (t)</text>
    
    <!-- Sine/Step Waveform -->
    <path d="M 20 65 Q 50 30 80 65 T 140 65 T 200 65 T 240 65" fill="none" stroke="#00f5ff" stroke-width="2" filter="url(#csGlow)"/>
    <line x1="20" y1="65" x2="240" y2="65" stroke="#334155" stroke-dasharray="3,3" stroke-width="1"/>

    <!-- Tech Badges -->
    <rect y="125" width="260" height="110" rx="10" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="20" y="152" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="13">C# &amp; WPF (.NET 9.0)</text>
    <text x="20" y="176" fill="#e2e8f0" font-family="sans-serif" font-size="12">Interactive Circuit Simulation</text>
    <text x="20" y="198" fill="#94a3b8" font-family="sans-serif" font-size="11">Ohm's Law Solver · Live Meters</text>
    <text x="20" y="220" fill="#a855f7" font-family="sans-serif" font-size="11">60 FPS Hardware-Accelerated UI</text>
  </g>
</svg>
