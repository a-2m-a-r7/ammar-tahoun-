<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#110d29"/>
      <stop offset="100%" stop-color="#1e103d"/>
    </linearGradient>
    <filter id="qGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#qBg)"/>

  <!-- Starfield Points -->
  <g fill="#a78bfa" opacity="0.6">
    <circle cx="90" cy="80" r="1.5"/>
    <circle cx="210" cy="140" r="1"/>
    <circle cx="340" cy="60" r="2"/>
    <circle cx="520" cy="110" r="1.5"/>
    <circle cx="680" cy="70" r="2"/>
    <circle cx="720" cy="200" r="1"/>
    <circle cx="150" cy="390" r="1.5"/>
    <circle cx="300" cy="420" r="1"/>
    <circle cx="630" cy="380" r="2"/>
  </g>

  <!-- Ambient Quest Glow -->
  <circle cx="400" cy="140" r="160" fill="#7c3aed" fill-opacity="0.14" filter="url(#qGlow)"/>

  <!-- Main Quest Window Frame -->
  <rect x="70" y="60" width="660" height="330" rx="16" fill="#0c0a1f" fill-opacity="0.9" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="70" y="60" width="660" height="42" rx="16" fill="#130e2c"/>
  <circle cx="100" cy="81" r="5" fill="#ef4444"/>
  <circle cx="118" cy="81" r="5" fill="#eab308"/>
  <circle cx="136" cy="81" r="5" fill="#22c55e"/>
  <text x="400" y="86" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AI Quest: Engineer Path (Electron 38 + React 19)</text>

  <!-- Top RPG Player Stat HUD -->
  <g transform="translate(100, 120)">
    <rect width="600" height="50" rx="8" fill="#1a1238" stroke="#6d28d9" stroke-width="1"/>
    
    <!-- Level Badge -->
    <rect x="15" y="10" width="65" height="30" rx="6" fill="#7c3aed"/>
    <text x="47" y="30" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">LVL 42</text>
    
    <!-- Class Title -->
    <text x="95" y="27" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">RAG &amp; Agent Architect</text>
    <text x="95" y="41" fill="#a78bfa" font-family="sans-serif" font-size="10">8 Worlds · 39 Topics</text>

    <!-- XP Bar -->
    <rect x="340" y="16" width="180" height="12" rx="6" fill="#0f0b24"/>
    <rect x="340" y="16" width="135" height="12" rx="6" fill="#00f5ff"/>
    <text x="535" y="26" fill="#00f5ff" font-family="monospace" font-size="10">75% XP</text>
  </g>

  <!-- Roadmap World Nodes -->
  <g transform="translate(100, 195)">
    <!-- World 1 -->
    <rect x="0" y="0" width="135" height="80" rx="8" fill="#130e2c" stroke="#10b981" stroke-width="1.5"/>
    <text x="67" y="24" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">WORLD 1</text>
    <text x="67" y="44" fill="#f8fafc" font-family="sans-serif" font-size="10" text-anchor="middle">Python &amp; Math</text>
    <text x="67" y="62" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">✓ COMPLETED</text>

    <line x1="135" y1="40" x2="155" y2="40" stroke="#7c3aed" stroke-width="2"/>

    <!-- World 2 -->
    <rect x="155" y="0" width="135" height="80" rx="8" fill="#130e2c" stroke="#10b981" stroke-width="1.5"/>
    <text x="222" y="24" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">WORLD 2</text>
    <text x="222" y="44" fill="#f8fafc" font-family="sans-serif" font-size="10" text-anchor="middle">Machine Learning</text>
    <text x="222" y="62" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">✓ COMPLETED</text>

    <line x1="290" y1="40" x2="310" y2="40" stroke="#7c3aed" stroke-width="2"/>

    <!-- World 3 -->
    <rect x="310" y="0" width="135" height="80" rx="8" fill="#130e2c" stroke="#00f5ff" stroke-width="1.5"/>
    <text x="377" y="24" fill="#00f5ff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">WORLD 3</text>
    <text x="377" y="44" fill="#f8fafc" font-family="sans-serif" font-size="10" text-anchor="middle">Deep Learning</text>
    <text x="377" y="62" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">⚡ IN PROGRESS</text>

    <line x1="445" y1="40" x2="465" y2="40" stroke="#7c3aed" stroke-width="2"/>

    <!-- World 4 -->
    <rect x="465" y="0" width="135" height="80" rx="8" fill="#130e2c" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="532" y="24" fill="#a78bfa" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">WORLD 4</text>
    <text x="532" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Vision &amp; NLP</text>
    <text x="532" y="62" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">🔒 LOCKED</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(100, 305)">
    <rect width="600" height="60" rx="8" fill="#130e2c" stroke="#334155" stroke-width="1"/>
    <text x="25" y="26" fill="#a78bfa" font-family="sans-serif" font-weight="bold" font-size="11">LOCAL-FIRST &amp; BILINGUAL</text>
    <text x="25" y="46" fill="#e2e8f0" font-family="sans-serif" font-size="11">English &amp; Arabic (RTL) · Zero-Cloud Dependency · LocalStorage</text>
    <rect x="480" y="16" width="105" height="28" rx="6" fill="#7c3aed" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1"/>
    <text x="532" y="34" fill="#c084fc" font-family="sans-serif" font-size="11" text-anchor="middle">RPG Tracker</text>
  </g>
</svg>
